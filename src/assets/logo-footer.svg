<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad-footer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <style>
    .brand-mark-f {
      font-family: 'Playfair Display', 'Cormorant Garamond', 'Didot', serif;
      font-size: 28px;
      font-weight: 700;
      fill: url(#gold-grad-footer);
    }
    .brand-name-f {
      font-family: 'Playfair Display', 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      fill: #FFFFFF;
      letter-spacing: 3px;
    }
    .brand-accent-f {
      fill: #FF5FA0;
    }
    .brand-sub-f {
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #FFB3D1;
      letter-spacing: 7px;
    }
  </style>
  <g transform="translate(10, 0)">
    <!-- Monogram Badge -->
    <circle cx="35" cy="42" r="22" fill="#2A0E1C" stroke="url(#gold-grad-footer)" stroke-width="1.5" />
    <text x="35" y="50" text-anchor="middle" class="brand-mark-f">IF</text>
    
    <!-- Text -->
    <text x="75" y="44" class="brand-name-f">ISAF<tspan class="brand-accent-f">È</tspan>R</text>
    <text x="77" y="62" class="brand-sub-f">BOUTIQUE</text>
  </g>
</svg>
