<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <style>
    .brand-mark {
      font-family: 'Playfair Display', 'Cormorant Garamond', 'Didot', serif;
      font-size: 28px;
      font-weight: 700;
      fill: url(#gold-grad);
    }
    .brand-name {
      font-family: 'Playfair Display', 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      fill: #1A0A12;
      letter-spacing: 3px;
    }
    .brand-accent {
      fill: #FF2D78;
    }
    .brand-sub {
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #8A4B6E;
      letter-spacing: 7px;
    }
  </style>
  <g transform="translate(10, 0)">
    <!-- Monogram Badge -->
    <circle cx="35" cy="42" r="22" fill="#FFF0F5" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="35" y="50" text-anchor="middle" class="brand-mark">IF</text>
    
    <!-- Text -->
    <text x="75" y="44" class="brand-name">ISAF<tspan class="brand-accent">È</tspan>R</text>
    <text x="77" y="62" class="brand-sub">BOUTIQUE</text>
  </g>
</svg>
